name: Publish Our Everyday to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified Pages update
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          patch = root / 'pages-update.zip'
          if patch.exists():
              assert hashlib.sha256(patch.read_bytes()).hexdigest() == 'c204965028293c10c6e7d48a7db8cbbf2ab688fb36dd263171009448d66c060d'
              allowed = {'vite.config.mjs', 'src/App.jsx', 'src/LoginGate.jsx', 'src/PagesNotice.jsx'}
              with zipfile.ZipFile(patch) as archive:
                  assert set(archive.namelist()) == allowed
                  for name in allowed:
                      (root / name).write_bytes(archive.read(name))
              patch.unlink()
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          VITE_GITHUB_PAGES: 'true'
      - run: npm run test:sites
      - run: node --test tests/auth-diary.test.mjs
      - run: node wechat-migration/tests/verify.mjs
      - name: Save source update and dependency lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Pages edition and synchronize dependency lock'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
